<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Item Card Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#131822;--panel2:#0f141c;--line:#232b3a;--text:#e6e9ef;--muted:#8b95a7;--accent:#3b82f6;--accent2:#2f6fdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
.hd{order:-2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 2px}
@media(max-width:560px){.hd{flex-wrap:wrap}}
.hd h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.hd p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.pv{order:-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{text-align:center;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px;max-width:900px;margin:0 auto;align-items:center}
.form>div{width:100%;min-width:0}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:700px){.form{grid-template-columns:1fr;gap:24px}}
label{text-align:center;display:block;font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent)}
input[type=file]{width:100%;font-size:12px;color:var(--muted);font-family:inherit}
input[type=file]::file-selector-button{margin-right:10px;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{margin:0;width:auto;padding:7px 13px;font-size:13px;font-weight:500;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{background:var(--accent2)}
button.small{margin:10px 0 0;padding:8px;font-size:12px;font-weight:500;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.small:hover{border-color:var(--accent);background:var(--panel2)}
.drop{width:100%;max-width:170px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted);margin:0 auto 10px;background:var(--panel2);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:14px;color:var(--text)}
#adj button{display:block;max-width:240px;margin:12px auto 0}
#dl{width:auto;margin:0;padding:10px 20px;white-space:nowrap}
#fit{width:100%;max-width:800px;margin:0 auto;overflow:hidden;border-radius:10px}
#scaler{transform-origin:0 0;width:1000px;height:300px}

var GAMES={
  coc:{n:'Clash of Clans',bg:'#7a4d1c'},
  cr:{n:'Clash Royale',bg:'#1f4e8c'},
  hd:{n:'Hay Day',bg:'#3f7d20'},
  bs:{n:'Brawl Stars',bg:'#23232e'},
  ot:{n:'Other',bg:'#23232e'}
};
var game='coc',logos={coc:DEF.coc,cr:DEF.cr,hd:DEF.hd,bs:DEF.bs};
function renderBadge(){
  $('badge').style.background=GAMES[game].bg;
  var b=$('blogo');b.innerHTML='';if(logos[game]){var im=new Image();im.onload=function(){var k=Math.min(54/im.naturalWidth,54/im.naturalHeight);im.style.width=(im.naturalWidth*k)+'px';im.style.height=(im.naturalHeight*k)+'px'};im.src=logos[game];b.appendChild(im)}else{b.innerHTML='<span style="position:relative;display:block;width:24px;height:24px"><i style="position:absolute;left:0;top:10.5px;width:24px;height:3px;border-radius:2px;background:#8b95a7"></i><i style="position:absolute;left:10.5px;top:0;width:3px;height:24px;border-radius:2px;background:#8b95a7"></i></span>'}
  var cs=document.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++)cs[i].className='chip'+(cs[i].dataset.k===game?' on':'');
}
Object.keys(GAMES).forEach(function(k){
  var c=document.createElement('button');c.className='chip';c.textContent=GAMES[k].n;c.dataset.k=k;
  c.onclick=function(){game=k;renderBadge();if(k==='ot')$('bfile').click()};$('chips').appendChild(c);
});
$('bfile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){logos[game]=r.result;renderBadge()};r.readAsDataURL(f);
  e.target.value='';
});
function outline(r){
  var s=[],n=24;
  for(var i=0;i<n;i++){var a=i*2*Math.PI/n;s.push((Math.cos(a)*r).toFixed(2)+'px '+(Math.sin(a)*r).toFixed(2)+'px 0 #000')}
  return s.join(',');
}
$('title').style.textShadow=outline(3);$('sub').style.textShadow=outline(2.5);$('exp').style.textShadow=outline(2);
function sync(){
  var p=parseInt($('pcs').value,10);if(isNaN(p))p=0;
  $('title').textContent=p+'x '+($('name').value||'');
  $('sub').textContent='0/'+p+' Claimed';
}
$('name').addEventListener('input',sync);$('pcs').addEventListener('input',sync);
var R=3,cv=$('cv'),ctx=cv.getContext('2d');cv.width=cv.height=185*R;
var S={img:null,z:1,ox:0,oy:0},fs=1;
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!S.img)return;
  var base=Math.min(150/S.img.width,150/S.img.height),sc=base*S.z;
  var w=S.img.width*sc,h=S.img.height*sc;
  ctx.drawImage(S.img,((185-w)/2+S.ox)*R,((185-h)/2+S.oy)*R,w*R,h*R);
}
function setFile(f){
  if(!f||f.type.indexOf('image')!==0)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){S.img=im;S.z=1;S.ox=0;S.oy=0;$('ph').style.display='none';$('adj').hidden=false;$('drop').textContent='Image added. Click or drop another to replace it.';draw()};
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
$('file').addEventListener('change',function(e){setFile(e.target.files[0]);e.target.value=''});
$('drop').addEventListener('click',function(){$('file').click()});
$('drop').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
function prevent(e){e.preventDefault()}
['dragenter','dragover'].forEach(function(t){
  [$('drop'),$('imgbox')].forEach(function(el){el.addEventListener(t,function(e){prevent(e);$('drop').classList.add('over')})});
});
['dragleave','drop'].forEach(function(t){
  [$('drop'),$('imgbox')].forEach(function(el){el.addEventListener(t,function(e){prevent(e);$('drop').classList.remove('over');if(t==='drop'&&e.dataTransfer.files.length)setFile(e.dataTransfer.files[0])})});
});
$('zreset').onclick=function(){S.z=1;S.ox=0;S.oy=0;draw()};
var drag=null,box=$('imgbox');
box.addEventListener('pointerdown',function(e){if(!S.img)return;drag={x:e.clientX,y:e.clientY};box.setPointerCapture(e.pointerId);box.style.cursor='grabbing'});
box.addEventListener('pointermove',function(e){
  if(!drag)return;
  S.ox+=(e.clientX-drag.x)/fs;S.oy+=(e.clientY-drag.y)/fs;drag={x:e.clientX,y:e.clientY};draw();
});
function endDrag(){drag=null;box.style.cursor='grab'}
box.addEventListener('pointerup',endDrag);box.addEventListener('pointercancel',endDrag);
box.addEventListener('wheel',function(e){
  if(!S.img)return;e.preventDefault();
  S.z=Math.max(0.2,Math.min(5,S.z*(e.deltaY<0?1.06:0.94)));draw();
},{passive:false});
function fit(){
  var w=$('fit').clientWidth;fs=Math.min(1,w/1000);
  $('scaler').style.transform='scale('+fs+')';
  $('fit').style.height=(300*fs)+'px';
}
window.addEventListener('resize',fit);
$('dl').addEventListener('click',function(){
  var btn=$('dl');btn.textContent='Generating…';
  html2canvas($('frame'),{scale:2,backgroundColor:null,useCORS:true,
    onclone:function(d){d.getElementById('scaler').style.transform='none';d.getElementById('inner').style.boxShadow='none';d.getElementById('imgbox').style.boxShadow='none';['innerfx','boxfx'].forEach(function(i){d.getElementById(i).style.display='block'});var inn=d.getElementById('inner');inn.style.borderTop='0';inn.style.top='38px';inn.style.height='227px';var g=d.createElement('div');g.style.cssText='position:absolute;left:45px;top:35px;width:910px;height:230px;border-radius:30px;background:#808792';inn.parentNode.insertBefore(g,inn);var fx=d.getElementById('innerfx');fx.style.top='38px';fx.style.height='227px';['ft','fl','fr'].forEach(function(c){fx.querySelector('.'+c).style.top='0px'})}
  }).then(function(c){
    var a=document.createElement('a');
    a.download=(($('name').value||'item').replace(/[^\w\u0980-\u09FF-]+/g,'_'))+'.png';
    a.href=c.toDataURL('image/png');
    document.body.appendChild(a);a.click();a.remove();
    btn.textContent='Download PNG';
  }).catch(function(){btn.textContent='Download PNG'});
});
sync();renderBadge();fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
</script>
</body>
